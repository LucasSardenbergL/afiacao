# TEMPORÁRIO — NÃO vai para a main (sai do branch antes do PR).
# Rodada 2: a prova CONSERTADA de db/test-tint-fase5-watchdog.sh no mesmo tipo de runner do job
# `provas-sql` (a rodada 1 mediu a original: 215s/251s, com 121s nas 2 primeiras varreduras):
#   (a) a prova final, ponta a ponta, 3× por VM;
#   (b) a instrumentada, para ver se algum regime lento de plano sobrevive em alguma suíte;
#   (c)/(d) ablações — sem os índices de prod / sem o ANALYZE — para medir se cada camada é necessária;
#   (e) o runner do núcleo com um manifesto só com ela: o recibo PASS=/FAIL= é aceito?
# Duas rodadas em paralelo = duas VMs = duas amostras.
name: medir-fase5-watchdog

on:
  push:
    branches: ['claude/elated-kapitsa-f522c6']

permissions:
  contents: read

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        rodada: [1, 2]
    steps:
      - uses: actions/checkout@v5

      - name: Máquina
        run: |
          echo "imagem: ${ImageOS:-?} ${ImageVersion:-?} · nproc=$(nproc) · $(grep -m1 'model name' /proc/cpuinfo)"
          bash --version | head -1

      - name: PostgreSQL 17 (PGDG)
        run: |
          set -euo pipefail
          tentar() { local n; for n in 1 2 3; do "$@" && return 0; echo "  ↻ tentativa $n falhou: $*"; sleep $((n * 5)); done; return 1; }
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            tentar sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* \
                       /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*msprod* || true
            tentar sudo apt-get update -qq
            tentar sudo apt-get install -y -qq postgresql-17
          fi
          /usr/lib/postgresql/17/bin/initdb --version | grep -E '\(PostgreSQL\) 17\.'

      - name: (a) prova FINAL — ponta a ponta, 3×
        run: |
          set -uo pipefail
          for i in 1 2 3; do
            s=$(date +%s.%N)
            PGPORT_TEST=$((5910 + i)) timeout 900 bash db/test-tint-fase5-watchdog.sh > "$RUNNER_TEMP/final-$i.log" 2>&1 && rc=0 || rc=$?
            e=$(date +%s.%N)
            grep -E 'FALSIF|^PASS=|^RESULTADO' "$RUNNER_TEMP/final-$i.log"
            echo "MEDIDA|${{ matrix.rodada }}|final-$i|rc=$rc|$(awk -v a="$s" -v b="$e" 'BEGIN{printf "%.1f", b-a}')s"
          done

      - name: (b) prova FINAL instrumentada
        run: |
          set -uo pipefail
          python3 db/medicao-fase5-watchdog/instrumenta.py db/test-tint-fase5-watchdog.sh db/_instr-fase5.sh
          s=$(date +%s.%N)
          TLOG="$RUNNER_TEMP/tempos-b.log" PGPORT_TEST=5920 timeout 900 bash db/_instr-fase5.sh > "$RUNNER_TEMP/instr.log" 2>&1 && rc=0 || rc=$?
          e=$(date +%s.%N)
          grep -E '^MEDIDA_|^PASS=|^RESULTADO' "$RUNNER_TEMP/instr.log"
          echo "MEDIDA|${{ matrix.rodada }}|instrumentada-final|rc=$rc|$(awk -v a="$s" -v b="$e" 'BEGIN{printf "%.1f", b-a}')s"

      - name: (c) ablação — sem os índices de prod
        run: |
          set -uo pipefail
          python3 db/medicao-fase5-watchdog/variante.py db/test-tint-fase5-watchdog.sh db/_v-sem-indices.sh sem-indices
          python3 db/medicao-fase5-watchdog/instrumenta.py db/_v-sem-indices.sh db/_vi-sem-indices.sh
          s=$(date +%s.%N)
          TLOG="$RUNNER_TEMP/tempos-c.log" PGPORT_TEST=5930 timeout 900 bash db/_vi-sem-indices.sh > "$RUNNER_TEMP/sem-indices.log" 2>&1 && rc=0 || rc=$?
          e=$(date +%s.%N)
          grep -E '^MEDIDA_(EVT\|(roda|suite|b14)|SUITE)|^PASS=|^RESULTADO' "$RUNNER_TEMP/sem-indices.log" | cut -c1-240
          echo "MEDIDA|${{ matrix.rodada }}|sem-indices|rc=$rc|$(awk -v a="$s" -v b="$e" 'BEGIN{printf "%.1f", b-a}')s"

      - name: (d) ablação — sem o ANALYZE (com os índices)
        run: |
          set -uo pipefail
          python3 db/medicao-fase5-watchdog/variante.py db/test-tint-fase5-watchdog.sh db/_v-sem-analyze.sh sem-analyze
          python3 db/medicao-fase5-watchdog/instrumenta.py db/_v-sem-analyze.sh db/_vi-sem-analyze.sh
          for i in 1 2; do
            s=$(date +%s.%N)
            TLOG="$RUNNER_TEMP/tempos-d$i.log" PGPORT_TEST=$((5940 + i)) timeout 900 bash db/_vi-sem-analyze.sh > "$RUNNER_TEMP/sem-analyze-$i.log" 2>&1 && rc=0 || rc=$?
            e=$(date +%s.%N)
            grep -E '^MEDIDA_(EVT\|(roda|suite|b14)|SUITE)|^PASS=|^RESULTADO' "$RUNNER_TEMP/sem-analyze-$i.log" | cut -c1-240
            echo "MEDIDA|${{ matrix.rodada }}|sem-analyze-$i|rc=$rc|$(awk -v a="$s" -v b="$e" 'BEGIN{printf "%.1f", b-a}')s"
          done

      - name: (e) runner do núcleo com manifesto de UMA linha
        run: |
          set -uo pipefail
          printf '%s\n' "db/test-tint-fase5-watchdog.sh             31" > "$RUNNER_TEMP/manifesto-1.txt"
          s=$(date +%s.%N)
          MANIFESTO="$RUNNER_TEMP/manifesto-1.txt" bash db/roda-nucleo-ci.sh > "$RUNNER_TEMP/runner.log" 2>&1 && rc=0 || rc=$?
          e=$(date +%s.%N)
          grep -E '✅|❌|SQL_PROOF_OK|REPROVADO|::error' "$RUNNER_TEMP/runner.log" || true
          echo "MEDIDA|${{ matrix.rodada }}|runner-1-linha|rc=$rc|$(awk -v a="$s" -v b="$e" 'BEGIN{printf "%.1f", b-a}')s"
