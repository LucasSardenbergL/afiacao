# CI — roda em PRs + pushes pra main.
#
# Lição do PR #4 (visual redesign, mergeado em 2026-05-14): o PR mergeou com 66
# classes Tailwind quebradas em produção (sed cego deixou `bg-status-*-bg0` em
# vez de `bg-status-*-bg`). Build NUNCA rodou antes do merge. Este workflow
# garante que isso não repita.
#
# Decisões de bloqueio:
# - typecheck (tsc --noEmit -p tsconfig.app.json): blocking — qualquer regressão
#   de tipos no src/ quebra o PR. ⚠️ Tem que ser `-p tsconfig.app.json`, NÃO o
#   `tsc --noEmit` cru: o tsconfig.json root usa `"files": []` + `"references"`,
#   e em modo não-build o tsc ignora as references e checa só o `files` (vazio)
#   → no-op que não type-checava o src de jeito nenhum. Isso deixou passar 2
#   TS2741 reais (#325 KpiCards.test.tsx, #345 FinanceiroFunding.tsx), só pegos
#   pelo Lovable. `-p tsconfig.app.json` checa src+testes de verdade.
#   ✅ CONVERGÊNCIA STRICT (2026-05-30): o `tsconfig.app.json` agora é `strict: true`
#   (+ noImplicitAny/strictNullChecks/noUnusedLocals/noUnusedParameters/
#   noFallthroughCasesInSwitch). O `tsconfig.strict.json` paralelo foi DELETADO e o
#   2º passo de typecheck removido — este passo único agora é o gate strict de TODO
#   o src + testes. A migração incremental (539→855 files) está concluída.
# - scripts:typecheck (tsc -p tsconfig.scripts.json): blocking — `scripts/` e `db/`, que o
#   passo acima NÃO cobre (`include: ["src"]`). Fechado em 2026-08-13; até então erro de tipo
#   nos próprios scripts que implementam os gates do CI passava verde. Detalhe no step.
#   ⚠️ NÃO troque o passo acima por `bun run typecheck`: desde 2026-08-27 esse script roda os DOIS
#   tsc (para o comando LOCAL não devolver verde falso sobre `scripts/`), então a troca faria o CI
#   type-checar `scripts/`+`db/` duas vezes. Aqui os dois passos chamam cada config direto, de
#   propósito — passo separado dá nome próprio à falha.
# - test (vitest run): blocking — regressão de comportamento documentado. ⚠️ Cobre só `src/**` +
#   `scripts/**` (o `include` do vitest.config.ts) — NÃO as edge functions, que são Deno.
# - test:edges (deno test --no-remote): blocking — os 119 testes das edge functions. Rodavam em
#   lugar NENHUM até 2026-07-18: existiam no repo, com script pronto no package.json, e o CI nunca
#   os chamou. Detalhe (inclusive por que NÃO existe um gate de pin do deno) no próprio step.
# - edges:typecheck (deno check): blocking — type-check dos 93 `index.ts` de edge. O `test:edges`
#   acima NÃO cobre isso: `deno test` só type-checa o grafo que os testes alcançam, e nenhum
#   `index.ts` é importado por teste algum. Até 2026-07-21 erro de tipo em edge passava VERDE em
#   todos os gates e só quebrava em RUNTIME na produção (#1498). Único step do job que precisa de
#   REDE; o porquê disso ser inevitável aqui está no próprio step.
# - build (vite build): blocking — pega Tailwind quebrado + import errors + PWA setup
# - lint (eslint): blocking em ERRORS — a dívida de `no-explicit-any` foi zerada
#   (era ~1300 errors, hoje 0; ver CLAUDE.md §10/§13), então o lint virou gate
#   real (2026-05-26). O que importa: a regra de segurança `no-restricted-syntax`
#   (anti-injeção PostgREST `.or()`, nível error, escopo src/ — eslint.config.js)
#   agora BLOQUEIA o PR de verdade; antes, com `continue-on-error`, um `.or()` cru
#   reintroduzido passava silencioso. WARNINGS (hoje 82, todos
#   react-hooks/exhaustive-deps) seguem NÃO-bloqueantes de propósito (eslint só
#   falha em error) — evita fricção no repo multi-sessão. Ratchet de warnings
#   (--max-warnings N) fica como follow-up se a contagem começar a crescer.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Validação PERIÓDICA da main — tapa a única janela que `pull_request`+`push` não cobrem.
  #
  # O buraco: merge de PR NÃO dispara o CI na main. Medido em 2026-07-21 (`gh run list --limit 60`):
  # TODO run com `event=push` é commit DIRETO do bot do Lovable; nenhum merge de PR (#1503/#1505/
  # #1506/#1507) gerou run de push. Causa: o auto-merge.yml usa `secrets.GITHUB_TOKEN`, e pela
  # proteção anti-loop do GitHub eventos disparados por esse token não acionam workflows. Ou seja, o
  # `push:` acima só pega a via do Lovable.
  #
  # Por que isso importa: dois PRs verdes ISOLADAMENTE podem quebrar a main JUNTOS (semantic
  # conflict) e ninguém saber. Ex. concreto com o `edges:typecheck`: PR A remove um export de
  # `supabase/functions/_shared/`, PR B adiciona um import dele — cada um passa, juntos dão TS2305.
  # Com ~30 worktrees paralelas e ~8 PRs mergeados por sessão, não é hipotético. Pior: o sintoma
  # aparece no lugar errado — o PRÓXIMO PR falha por algo que o autor não causou.
  #
  # Por que `schedule` e não PAT/merge-queue: evento `schedule` roda SEMPRE no default branch, então
  # `github.ref` já é `refs/heads/main` e os dois steps de alerta lá embaixo
  # (`if: failure() && github.ref == 'refs/heads/main'` / `success() && ...`) passam a cobrir esta
  # via SEM alteração — abrem e fecham a Issue `ci-main-red` sozinhos. Trocar o token do auto-merge
  # por um PAT/App faria o push disparar o CI, mas custa gerenciar credencial e um run de ~5min por
  # merge; merge queue resolve melhor (valida a combinação ANTES da main) mas muda o fluxo do repo
  # inteiro. Diário é o piso útil: pega o conflito no dia seguinte por ~150 min/mês de Actions.
  #
  # Horário: 09:17 UTC ≈ 06:17 BRT — o founder começa o dia com o sinal, e o minuto quebrado evita a
  # fila de crons "redondos" do GitHub (que atrasa muito em :00). ⚠️ O GitHub DESABILITA cron após
  # 60 dias sem atividade no repo; se o repo hibernar, reativar na aba Actions.
  schedule:
    - cron: '17 9 * * *'
  # Botão "validar a main agora" (aba Actions → CI → Run workflow), sem esperar as 09:17. Serve para
  # (a) confirmar a main na hora depois de uma leva de merges, e (b) VERIFICAR este próprio desenho:
  # como `workflow_dispatch` na main também dá `github.ref == 'refs/heads/main'`, ele exercita os
  # mesmos dois steps de alerta que o `schedule` vai exercitar — sem isso, a primeira prova de que a
  # Issue abre/fecha só viria no primeiro cron.
  workflow_dispatch:

# ┌─ FAN-OUT (2026-09-07) ─────────────────────────────────────────────────────────────────────────┐
# O `validate` era UM job serial de ~40 steps, com `timeout-minutes: 15`. Medido em 2026-09-07 sobre
# 134 runs (`gh run view --json jobs`, decompondo `steps[].startedAt/completedAt`):
#
#   08-27 mediana 550s · 08-31 574s · 09-05 702s · 09-06 813s · 09-07 839s (máx 917s)
#
# +52% em 11 dias, monotônico — e o teto não se mexeu. No dia 09-07, 34/69 runs passaram de 14min e
# **5 estouraram os 15**. Run estourado sai `cancelled`, NÃO `failure`: some do radar de "CI vermelho"
# e parece problema de runner.
#
# A causa NÃO é saturação de runner, embora houvesse 3-4 runs simultâneos na main: a correlação entre
# duração e nº de runs concorrentes é **+0,11** (n=69) — ruído. Com 1 concorrente a mediana era 885s;
# com ≥4, 840s. O job simplesmente CRESCEU. De +347s (533s→880s) entre 08-27 e 09-07:
#
#   Falsificação  46s → 201s  (+155s, 4,4×)   ← custo é LINEAR no nº de regras sabotadas
#   Tests        304s → 383s  (+79s)
#   6 steps NOVOS que não existiam        (+61s: sonda cron-prova 32s, lint:shell 25s, …)
#
# Ou seja: dois steps O(n) no tamanho do repo, contra um teto fixo. Subir o teto só adia o sorteio —
# cada gate novo (e este repo adiciona gates toda semana) reaproxima a colisão. O caminho crítico é
# que precisa encolher, e ele é serial por acidente, não por dependência: typecheck não depende de
# vitest, que não depende de shellcheck.
#
# Fan-out em 4 jobs paralelos, cortados em FATIAS CONTÍGUAS da ordem original (o diff move zero
# steps de lugar — só insere cabeçalho de job nos 4 pontos de corte, preservando cada comentário
# onde estava). Caminho crítico passa a ser o maior job, `testes` (~395s), contra 886s serial: -55%.
#
# ⚠️ `validate` CONTINUA EXISTINDO, agora como agregador — é o ÚNICO required status check da branch
# protection (`gh api repos/:owner/:repo/branches/main/protection` → contexts: ["validate"]) e o que
# o auto-merge.yml espera. Renomeá-lo/removê-lo travaria TODO PR do repo para sempre. Ao adicionar um
# job novo aqui, ele PRECISA entrar no `needs:` do agregador — senão fica fora do gate, verde por
# ausência. Detalhe da medição: docs/historico/ci-validate-timeout-15min.md
#
# ⚠️ NÃO baixe os tetos abaixo sem REMEDIR — a regra é do #2338, que chegou primeiro pelo outro
# lado do mesmo defeito e a generalizou em `docs/historico/timeout-de-job-e-ausencia-de-dado.md`:
# timeout de job NÃO é veredito, é AUSÊNCIA DE DADO, e é a única falha do repo capaz de reprovar
# código SADIO. Aquele PR mediu a VARIÂNCIA (o runner vem em duas populações, todo step escala
# junto ~30%) e comprou folga subindo 15→25min; esta medição, por dias, mostrou a TENDÊNCIA
# (+52% em 11 dias) — as duas são verdadeiras, e é a soma que explica o sintoma: a tendência
# fechou a margem, a variância decidiu QUAL run morria. Subir o teto trata a segunda; o fan-out
# trata a primeira, e por isso os 25min do #2338 saíram daqui: com o caminho crítico em ~395s,
# cada job carrega teto próprio com folga MAIOR do que aquele número comprava no job serial.
# └────────────────────────────────────────────────────────────────────────────────────────────────┘
jobs:
  # ─── Job 1/4 — typecheck (medido: ~53s) ─────────────────────────────────────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      # `fetch-depth: 0` é o que dá merge-base ao gate `sonda:bump` (lá embaixo): sem histórico o
      # checkout é shallow (depth 1) e `git merge-base origin/main HEAD` não resolve — e esse gate
      # é fail-CLOSED, então ele reprovaria o repo inteiro em vez de degradar. Custo medido: ~118 MB
      # de clone. A alternativa (`git diff HEAD^1 HEAD` sobre o merge commit de `refs/pull/N/merge`)
      # é mais barata mas amarra o gate à mecânica de checkout do Actions e não roda igual local.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # ⚠️ bun-version tem que ser semver ESTRITO (x.y.z) — NÃO `latest`, `1.3`,
      # `^1.3.14` nem `1.3.x` (o exemplo da doc do input!). Só o estrito casa o
      # `validateStrict()` da action (src/download-url.ts) e pula a chamada a
      # api.github.com/repos/oven-sh/bun/git/refs/tags; qualquer outro formato cai
      # nela e reintroduz a dependência de rede no caminho de entrega. Com
      # `latest` a action também desliga o cache de propósito (isCacheEnabled).
      # Lição de 2026-07-16: incidente "Degraded REST API Availability" do GitHub
      # (~35% das chamadas REST falhando) derrubou TODO PR do repo em ~6s no setup
      # do bun — inclusive PRs de 1 linha de markdown. Bump: conferir `bun --version`
      # local e alinhar TODAS as ocorrências — hoje são 6 (os 4 jobs do fan-out
      # `typecheck`/`testes`/`edges-e-build`/`gates-e-falsificacao` + `authz-sentinela`
      # + `mutation-check`). `bun run bunpin:check` prova que todas são semver estrito,
      # mas NÃO prova que estão na mesma versão — essa parte é olho.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # ─── Blocking checks ────────────────────────────────────────────
      - name: Type check (strict — todo o src + testes)
        run: bunx tsc --noEmit -p tsconfig.app.json

      # Type-check de `scripts/` + `db/` — blocking. O passo acima cobre só `src/` (o `include` do
      # tsconfig.app.json), e mais nada no repo cobria estes dois diretórios: knip varre
      # `src/**`+`supabase/functions/**`, vitest EXECUTA `scripts/**/*.test.ts` mas transpila sem
      # type-checar, e eslint não type-checa. Erro de tipo em `scripts/` passava VERDE nos 4 gates —
      # inclusive nos scripts que SÃO os gates (authz-gate-check, bun-pin-gate-check,
      # docs-indice-gate-check, edges-typecheck-gate). Mesma classe do #1498, que fechou a lacuna
      # equivalente das edges.
      #
      # Não é hipotético: o #1201 (faxina de dead code) deletou `src/lib/radar/types.ts` como "0 refs
      # provadas" e quebrou `scripts/radar/carga.ts` — o TS2307 ficou verde 5 semanas, porque a ref
      # era invisível ao knip (fora do `project`) E ao tsc (fora do `include`). Era 1 dos 10 erros
      # reais que este gate encontrou ao nascer; todos corrigidos, então ele entra em ZERO.
      #
      # SEM baseline/allowlist de propósito: o gate zerou (10 erros → 0), e um arquivo-lista de
      # exceções viraria ímã de conflito entre as ~30 worktrees paralelas — a mesma razão pela qual
      # o edges:typecheck preferiu classes-bloqueantes a uma denylist de arquivos. Aqui não precisa
      # nem disso: erro NOVO em QUALQUER arquivo de scripts/ ou db/ fica vermelho.
      # Barato (~3s, sem rede nem toolchain extra) → roda cedo, junto do typecheck irmão.
      - name: Type check (scripts/ + db/)
        run: bun run scripts:typecheck

  # ─── Job 2/4 — vitest (medido: 383s no pior caso; 60% do job serial antigo) ──
  # Sozinho de propósito: é o caminho crítico do CI inteiro, então qualquer step que
  # dividisse runner com ele só o empurraria para cima. É também o step que mais
  # cresce — `bun run test` é O(nº de arquivos de teste).
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Preâmbulo comum aos 4 jobs de trabalho. O PORQUÊ de cada escolha (`fetch-depth: 0`
      # para o merge-base do `sonda:bump`; `bun-version` semver ESTRITO) está comentado por
      # extenso no job `typecheck` — não repetido aqui para não quadruplicar o texto.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun run test

      # O vitest procura `@vitest-environment` com REGEX NO ARQUIVO INTEIRO e aceita o alias
      # `jest` (coverage.DfSpMS-b.js:2403). Num repo de gates textuais, um teste que CITE o
      # literal para asserir sobre outro arquivo troca o próprio ambiente em silêncio — e fica
      # verde, porque não sabe em que ambiente deveria estar. Reproduzido ao construir o gate, e
      # medido de novo no #2336: citar o token EM PROSA liga o ambiente, inclusive negando
      # (docs/historico/docblock-de-ambiente-que-liga-o-que-nega.md). Desde aquele PR a diretiva
      # é o override oficial do particionamento por extensão — 22 arquivos a usam —, e até aqui
      # o único guarda dela era um comentário no vitest.config.ts.
      # Roda DEPOIS do `Tests` de propósito: o denominador do gate é a união dos `include` dos
      # `test.projects`, e uma suíte vermelha por outro motivo tem de aparecer primeiro.
      - name: Diretiva de ambiente — uma só, no cabeçalho, na allowlist
        run: bun run gate:ambiente

  # ─── Job 3/4 — edges (Deno) + sondas de versão + build + lint (medido: ~150s) ─
  # Agrupados por TOOLCHAIN: é a fatia que precisa do Deno instalado. Build e lint vêm
  # junto por serem contíguos na ordem original e baratos (25s + 22s) — cabem à sombra
  # do `testes` sem alongar o caminho crítico.
  edges-e-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      # Preâmbulo comum — porquê no job `typecheck`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # Testes das EDGE FUNCTIONS (Deno) — blocking. Os 119 testes em
      # supabase/functions/**/*_test.ts existiam com script pronto (`test:edges`) e NADA no CI os
      # rodava: o `bun run test` do job `testes` é vitest, cujo `include` (vitest.config.ts) é só
      # `src/**` + `scripts/**`. Eram documentação executável, não guarda de regressão — um PR podia quebrá-los
      # com o CI VERDE e, como todo PR não-draft auto-mergeia no verde, a regressão entrava sozinha.
      # Motivador concreto: os invariantes de CUSTO de _shared/relatorio-mensal_test.ts existem pra
      # impedir que o N+1 de ~5.285 consultas volte (PR #1432) — e hoje não impediriam nada.
      # Custo: ~0,6s de teste; o setup do Deno domina. Roda DEPOIS de typecheck+vitest de propósito
      # (PR quebrado no comum falha antes, sem pagar o setup).
      #
      # ⚠️ NÃO espelhar aqui o gate `bunpin:check`: o raciocínio do pin do bun NÃO transfere. A
      # `oven-sh/setup-bun` só PULA a api.github.com quando o valor casa `validateStrict()` — é ISSO
      # que o gate protege. A `denoland/setup-deno` não tem esse fast-path: com `2.9.2` ela cai em
      # resolveRelease(range) → fetch `dl.deno.land/versions.json`; com `latest`, em
      # `release-latest.txt`. Mesma rede nos dois casos → um gate espelhado não removeria UM request
      # sequer, só daria falsa segurança. O pin estrito aqui é por REPRODUTIBILIDADE (o runtime não
      # muda sozinho num PR alheio), não anti-SPOF. Bump: conferir `deno --version` e alinhar.
      #
      # O `--no-remote` (dentro de `test:edges`) é a invariante que substitui aquele gate: prova que
      # a suíte é 100% OFFLINE, mantendo jsr.io/npm FORA do caminho de entrega de todo PR — a mesma
      # forma do incidente de 2026-07-16. Ele foi introduzido junto com a troca do `jsr:@std/assert@1`
      # de omie-sync-status-produtos/paginacao.test.ts (único dos 11 arquivos fora do padrão) por
      # helper local. Consequência a saber: teste de edge que precise de `npm:`/`jsr:` NÃO roda aqui
      # — a saída é extrair a lógica PURA e testar ela (o que os 11 arquivos já fazem), não afrouxar
      # o flag.
      #
      # O pin do deno tem 3 ocorrências (esta, o job `gates-e-falsificacao` — cujo
      # `test:falsificacao` chama `sonda-cron-prova.ts`, que faz `spawnSync('deno')` — e o
      # `mutation-check`, que roda contrato .mut de edge) — bump alinha as três.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2

      - name: Tests (edge functions — Deno, offline)
        run: bun run test:edges

      # TESTE DECISIVO da sonda por cron (spec 2026-09-05-sonda-por-cron-fail-closed-design.md §5):
      # materializa bundles históricos REAIS por `git archive` — inclusive os que NÃO autenticavam
      # nada (monthly-report@ef08dddd2 manda e-mail para qualquer POST; calculate-scores@45a80118b
      # faz 11 escritas) — e exige que o OPTIONS que o relé emite produza ZERO efeito, com controle
      # positivo provando que o contador enxerga o fluxo real daquele mesmo bundle. Precisa de
      # `fetch-depth: 0` (já é), `git` e `tar`. Continua offline: `--no-remote`.
      - name: Sonda por cron — rollback para bundle velho fica em ZERO efeito (Deno, offline)
        run: bun run test:sonda-rollback

      # PROVA da allowlist da sonda por cron: cobertura do manifesto (todo closure histórico de cada
      # edge da allowlist, na identidade de harness E de `desde` atuais) + G1 (ramo dentro do bloco
      # OPTIONS) + G3 (o relé só emite OPTIONS, medindo a VARIÁVEL que passou pela barreira) + G4
      # (o espelho no banco ⊆ allowlist) + o sentinela do stripper. Re-executa o que mudou; exit 2
      # é MECÂNICA (git raso, deno ausente), que nunca é "tudo limpo".
      - name: Sonda por cron — prova por execução de cada closure histórico (G1/G3/G4)
        run: bun run sonda:cron-prova -- --gate

      # Type-check das EDGE FUNCTIONS — blocking. Buraco que ficou aberto mesmo depois do
      # `test:edges` acima: `deno test` só type-checa o grafo que os TESTES alcançam, e por desenho
      # os testes cobrem lógica PURA extraída (justamente para caber no `--no-remote`), então
      # NENHUM `index.ts` de edge entra no grafo. Somado a `typecheck` (só src/) e `lint` (não
      # type-checa Deno), erro de tipo numa edge ficava VERDE em TODOS os gates e só quebrava em
      # RUNTIME na produção, depois do deploy manual pelo chat do Lovable. Detectado no PR #1498:
      # `classifyProfile` usado sem estar no import passou por 5.527 testes vitest, 181 testes deno,
      # typecheck e lint — só apareceu num `deno check` manual.
      #
      # ⚠️ Este step PRECISA de rede, ao contrário do `test:edges` — não dá para espelhar o
      # `--no-remote` aqui: as edges importam `npm:`/`https://` de verdade e o check resolve o grafo
      # todo (2.245 downloads, ~48s cold / ~2,5s warm). Mitigação do que dá: dos 3 hosts,
      # `registry.npmjs.org` (2.087 requests) JÁ está no caminho de entrega via `bun install`; os
      # novos são `esm.sh` (135) e `deno.land` (23), ambos de import legado — 34 edges em
      # `deno.land/std/http/server.ts` (o `Deno.serve` nativo substitui) e 18 em
      # `esm.sh/@supabase/supabase-js` (tem equivalente `npm:`). Migrar as duas famílias zera os
      # hosts novos: é o follow-up 2 do spec.
      #
      # Sem `actions/cache` de propósito: o DENO_DIR fica em 681 MB (677 de tarballs npm) e
      # economizaria ~30s dos 48s consumindo ~7% do budget de 10 GB do repo, mais drift de chave —
      # e não há `deno.lock` versionado (está no .gitignore) para chavear. Roda DEPOIS de
      # typecheck+vitest+test:edges pelo mesmo motivo que o `test:edges`: PR quebrado no comum falha
      # antes de pagar a rede.
      #
      # O gate é de PRECISÃO, não de recall: falha só nas 6 classes de "símbolo/módulo não resolve"
      # (a do #1498), que hoje estão em ZERO nas 93 edges — por isso não precisa de allowlist. As
      # outras 141 (dívida de tipos gerados do Supabase) são reportadas sem falhar. O porquê da
      # escolha, os números e os follow-ups estão no cabeçalho do script e no spec:
      # docs/superpowers/specs/2026-07-21-edges-typecheck-gate-design.md
      - name: Type check (edge functions — Deno)
        run: bun run edges:typecheck

      # A OMISSÃO que o gate de texto não alcança. ~30 edges carregam um `versao.ts` cujo `VERSAO`
      # é a ÚNICA prova de qual bundle está em produção (o Lovable Cloud não dá N2 — não existe
      # Access Token para o founder gerar). Marcador IGUAL na `main` e em prod responde a mesma
      # string tendo o deploy acontecido ou não, então ele só prova algo se for bumpado ANTES do
      # deploy. Medido: o #1930 escreveu `v1.0-prompt-invertido-cacheado` na `analyze-unified-order`
      # e o #1938 alterou a edge sem bumpar — a sonda de prod respondeu esse mesmo valor em
      # 2026-08-25 (request_id 59657), provando "≥ #1930" e nada mais. O gate `bump
      # v1.1-corpo-tipado` do `_shared/sonda-versao-contrato_test.ts` barra a REGRESSÃO (voltar ao
      # literal antigo); só o DIFF sabe da OMISSÃO, e é isto aqui.
      # Régua medida contra as 414 fatias anteriores a 2026-08-25, com o próprio gate decidindo: 26
      # tocam uma das 32 edges instrumentadas e 6 reprovariam — o #1938 entre elas, e nenhuma sem
      # mudança real de `index.ts`. `_shared/` fica FORA de propósito (cobri-lo daria 290 pares
      # edge×fatia em 25 fatias, ~12 bumps por PR); detalhe no cabeçalho do script.
      # Só em `pull_request`: no `push`/`schedule` da main não existe "a fatia" contra a qual medir.
      - name: Sonda de versão — bump obrigatório na edge alterada
        if: github.event_name == 'pull_request'
        run: bun run sonda:bump

      # A METADE que o `sonda:bump` acima deixa aberta, e ele diz isso no próprio comentário:
      # `_shared/` fica FORA dele de propósito (cobri-lo daria ~12 bumps À MÃO por PR). Só que a
      # mudança de comportamento pode chegar INTEIRA por lá — medido: o 8ee8afa15 trouxe metade da
      # reescrita do pós-login Sayerlack via `_shared/sayerlack-pos-login.ts`, e nenhum `VERSAO`
      # mudou. Aqui o fan-out não custa disciplina porque o CI REGENERA o fingerprint.
      #
      # Roda em TODO evento (≠ do `sonda:bump`, que é `pull_request`-only): é gate de ESTADO, não
      # de diff — não precisa de base ref, então cobre o `push` do Lovable e o cron da main, e
      # descobre desvio ANTIGO, não só o da fatia.
      - name: Sonda de versão — fingerprint da fonte bate com o mapa servido
        run: bun run sonda:fingerprint

      # INFORMATIVO, não gate — e a diferença é o desenho, não preguiça. Os dois passos acima
      # deixam o autor CEGO para a consequência da própria mudança: quem muda `_shared/x.ts` vê o
      # `sonda:bump` verde (exclui `_shared/` de propósito) e o `--write` regenerar o mapa em
      # silêncio, e nunca fica sabendo QUAIS edges tiveram o `fonte` alterado nem se alguma delas
      # merecia bump. Medido em 11 dias (2026-09-05): 66 mudanças de `fonte`, 22 pedidos de deploy
      # só por fan-out sem a edge mudar, 18 de um único PR (#2132). A decisão P1/P2
      # (`scripts/lib/pendencias-deploy.ts`) era tomada DEPOIS, por outra sessão.
      # Este passo imprime, uma linha por edge, quem virou SEM_BUMP (→ DIVERGE_P2, leva agrupada)
      # e quem bumpou (P1) — para o autor decidir ALI. Nunca reprova: exit 0 com achados, 2 só por
      # mecânica; `continue-on-error` porque aviso que grita 12× por PR treina a ignorar (a mesma
      # medição que tirou `_shared/` do `sonda:bump`). `pull_request`-only: precisa da fatia.
      - name: Sonda de versão — fan-out de _shared/ na fatia (informativo, nunca reprova)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: bun run sonda:fanout

      # O terceiro buraco, e o mais silencioso: os dois gates acima têm o MESMO universo — as
      # edges JÁ instrumentadas. Quando o universo é lista derivada de artefato opt-in, quem nunca
      # entrou não reprova: SOME. Medido (2026-08-28): a `analytics-outbox-drain` nasceu no #2035
      # sem `versao.ts` e fora do mapa, nenhum gate reclamou, e `cobertura: 39/39` era 39/40 — o
      # 40º não estava reprovado, estava ausente do denominador. Este gate cobra a DECISÃO no dia
      # em que a pasta nasce: `versao.ts` + mapa, OU o nome em `DISPENSAS` com justificativa
      # assinada. As 55 não-instrumentadas não são dívida (leitura pura é exceção declarada desde
      # a 3ª leva) — o que ele proíbe é a omissão, não a dispensa.
      # `pull_request`-only pelo mesmo motivo do `sonda:bump`: no push/schedule da main a
      # merge-base é o próprio HEAD, e diff vazio se leria como "nenhuma edge nasceu".
      - name: Sonda de versão — edge NOVA declara se é instrumentada ou dispensada
        if: github.event_name == 'pull_request'
        run: bun run sonda:nova

      # O QUARTO buraco, e o que sustenta o veredito do 401: o `controle_ativo` do
      # `sonda-versao-sql.ts` trata uma resposta de sonda como TESTEMUNHA de que o `x-cron-secret`
      # foi aceito. Isso só vale porque a resposta sai DEPOIS do gate de credencial — medido 60/60
      # em 2026-09-09, e medição datada não impede a edge instrumentada AMANHÃ de responder antes
      # de autenticar. Essa regressão não apareceria em lugar nenhum: o SQL seguiria verde,
      # contando como prova uma resposta que não prova nada, e o desfecho é redeploy à toa de edge
      # money-path. Gate de ESTADO (roda em TODO evento, ≠ dos `pull_request`-only acima): a
      # invariante vale para a árvore inteira, não para a fatia.
      - name: Sonda de versão — a resposta só sai DEPOIS do gate de credencial
        run: bun run sonda:autentica

      # O outro MARCADOR. As canárias versionam por `contrato`, com a mesma classe de falha:
      # congelado, a canária responde a mesma string tendo o deploy acontecido ou não, e um deploy
      # integralmente velho compara `expected` velho com código velho e mente `ok:true`. A auditoria
      # dos 7 `contrato` (`5d8f1f779`) fechou dizendo que o furo "não é um contrato parado — é a
      # falta de gate"; é este.
      # A régua NÃO é a dos dois gates acima, e a diferença foi MEDIDA: exigir bump do `contrato` a
      # cada mudança do corpo reprovaria 8 de 10 fatias, 7 delas mexendo em parte da edge que a
      # canária não atesta. Ela é escolhida pelo que a edge tem — sem `versao.ts` (logo também fora
      # do mapa de fingerprints) o `contrato` é o único marcador de bundle, e a régua é o corpo
      # servido; com `versao.ts` os dois gates acima já respondem por isso, e a régua vira a
      # SUPERFÍCIE da canária (o bloco dela + o fecho dos símbolos que ela exercita, `_shared/`
      # incluído por SÍMBOLO). Assim medido: 2 reprovações em 400 fatias, mais o `f6561b0b2` — o
      # caso concreto que a auditoria acima aponta — logo antes da janela. Limites no cabeçalho.
      - name: Canária de deploy — bump obrigatório do `contrato` que ela atesta
        if: github.event_name == 'pull_request'
        run: bun run canaria:bump

      - name: Build
        run: bun run build
        env:
          # Build precisa do mesmo ambiente que Lovable produção.
          # Se algum VITE_* for required no futuro, adicionar aqui.
          NODE_ENV: production

      # Bloqueia em errors (0 hoje); warnings não falham (eslint default).
      - name: Lint
        run: bun lint

  # ─── Job 4/4 — gates textuais + falsificação (medido: ~332s) ────────────────
  # O 2º maior bloco do CI, e o que MAIS cresceu (Falsificação: 46s→201s em 11 dias, 4,4×)
  # — porque sabota UMA REGRA POR VEZ e exige vermelho em cada, então o custo é linear no
  # nº de regras. Fica em job próprio para que esse crescimento não some com o do vitest.
  #
  # ⚠️ Este job precisa de DOIS toolchains além do bun, e nenhum deles é opcional:
  #   · shellcheck 0.11.0 — `test:hooks` roda `test-shellcheck-gate.sh`, que exige resposta
  #     POSITIVA de `shellcheck --version` e ABORTA sem ela (fail-closed de propósito:
  #     docs/historico/sonda-ausente-em-script-que-apaga.md). É o 1º step abaixo.
  #   · deno — `test:falsificacao` termina em `sonda-cron-prova.ts --falsificar`, que faz
  #     `spawnSync('deno')` e lança `Mecanica('deno ausente')`. Sem o setup, o job reprova
  #     com erro de mecânica, não de conteúdo.
  gates-e-falsificacao:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      # Preâmbulo comum — porquê no job `typecheck`.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # Ver o ⚠️ do cabeçalho: `test:falsificacao` → `sonda-cron-prova.ts` → `spawnSync('deno')`.
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2

      # Shell lint. Existia como comando local (`/health`) e NUNCA como gate de CI — e o escopo
      # local era `scripts/*.sh .claude/hooks/*.sh`, sem `db/*.sh`. Medido em 2026-08-28: o escopo
      # antigo estava em exit 0, e os 267 `db/*.sh` que ficavam de fora tinham 83 avisos em 21
      # arquivos. `db/test-*.sh` é onde moram as PROVAS EXECUTADAS do SQL de risco (ritual
      # prove-sql-money-path) — o pior lugar do repo para não ter linter, porque harness com bug de
      # shell não fica vermelho: ele passa e AFIRMA que a invariante vale.
      # Três dos 83 eram DEFEITO, cada um provado com repro antes do conserto:
      #   · SC2181 (`cmd; if [ $? -ne 0 ]`) sob `set -e` em função chamada nua: o `set -e` matava o
      #     script no `cmd` e o bloco "falsificação INVÁLIDA" era inalcançável — o harness não sabia
      #     distinguir "sabotagem não aplicou" de "gate sem dente".
      #   · SC2006 (crase) dentro de heredoc INTERPOLADO: o shell executava o conteúdo da crase e o
      #     psql recebia o comentário mutilado, com `command not found` entrando na var capturada.
      #   · `grep -v '^$'` sob `pipefail` com lista vazia: matava o harness exatamente no caso que
      #     ele existe para reportar. Nenhum dos três vira teste vermelho — só o linter os vê.
      # Roda `bun run lint:shell`, o MESMO comando do health stack local, de propósito: gate de CI
      # que diverge do comando local recria a lacuna que veio fechar (mesma regra do knip).
      # Entra em ZERO, sem baseline: exceção é `# shellcheck disable=` no ponto de uso, com o porquê
      # ao lado. O gate imprime a VERSÃO do shellcheck no log — releases mudam o conjunto de checks,
      # e é isso que explicaria um "verde no laptop, vermelho aqui".
      # Falsificação (sabota e exige vermelho) roda no passo `Hooks guard tests`:
      # scripts/test-shellcheck-gate.sh.
      # Versão PINADA. O comentário acima previu o "verde no laptop, vermelho aqui" — e foi
      # exatamente o que aconteceu ao destravar este PR (2026-09-07): o runner trazia **0.9.0**,
      # cujo SC2317 rende **86 falsos-positivos** em db/*.sh que a 0.11.0 já não emite, e o gate
      # reprovava sem defeito nenhum no código. Gate cuja VERDADE depende da versão do runner não
      # é gate, é sorteio — e o custo dele é a fila: cada falso-vermelho são ~13min + um
      # round-trip. Pinar é o que faz `bun run lint:shell` local e o CI darem o MESMO veredito.
      # A asserção final é POSITIVA de propósito: instalar sem conferir a versão instalada
      # reintroduziria a mesma cegueira que este passo veio fechar.
      - name: shellcheck pinado 0.11.0 (o runner traz 0.9.0)
        run: |
          set -euo pipefail
          ver=v0.11.0
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/${ver}/shellcheck-${ver}.linux.x86_64.tar.xz" | tar -xJ
          sudo install -m 0755 "shellcheck-${ver}/shellcheck" /usr/local/bin/shellcheck
          rm -rf "shellcheck-${ver}"
          instalada=$(shellcheck --version | awk '/^version:/{print $2}')
          [ "$instalada" = "0.11.0" ] || { echo "::error::shellcheck instalado=$instalada, esperado 0.11.0"; exit 1; }
          echo "shellcheck pinado e conferido: $instalada"

      - name: Shell lint gate (shellcheck — scripts/ + hooks/ + db/)
        run: bun run lint:shell

      # A senha real do `claude_rw` não entra na história do repo. O `db/claude-rw-bootstrap.sql` é
      # a única colagem manual que resta: o founder troca `TROQUE_ESTA_SENHA` pela senha real, cola
      # no SQL Editor do Lovable e tem de restaurar o placeholder. Em 2026-09-07/08 a senha real
      # ficou na árvore de trabalho DUAS vezes — nenhuma foi commitada, mas o que impediu foi um
      # agente conferir na hora, e frase-em-doc não é guarda neste repo.
      #
      # O QUE ESTE PASSO NÃO É: ele não impede o vazamento. Quando ele reprova, o commit já está no
      # remoto e a senha com ele — o que ele faz é DETECTAR e obrigar a rotação (a mensagem do gate
      # diz isso). Quem impede é o pre-commit (`bun run hooks:instalar`), que roda o MESMO script
      # com `--staged`. As duas camadas cobrem buracos diferentes de propósito: o hook não vale em
      # `--no-verify` nem em máquina onde ninguém o instalou (o commit do sync do Lovable, por
      # exemplo, nasce fora daqui); este passo não tem como ser pulado.
      #
      # O gate NUNCA imprime a linha ofensora — publicá-la neste log seria o próprio vazamento.
      # Falsificação (10 sabotagens × 2 locales) roda em `Hooks guard tests` / `test:falsificacao`.
      - name: Senha do bootstrap — placeholder no lugar (nunca imprime o literal)
        run: bun run gate:senha-bootstrap

      # Anti-inchaço do CLAUDE.md (carregado em toda sessão+subagente). Teto
      # apertado (20 KB / 2,6k palavras / linha ≤2000c) vs ~13 KB pós-refactor
      # da frente 1 (2026-06-15). Estourar = mover a lição pra docs/agent/ e o
      # histórico pra docs/historico/ (ver topo do CLAUDE.md). Ver scripts/check-claude-md-budget.sh.
      # Desde 2026-08-22 mede também POR SEÇÃO, com ratchet em scripts/claude-md-secoes-baseline.txt:
      # teto só do arquivo inteiro deixava "⚠️ Armadilhas recorrentes" (46% do arquivo, e a seção
      # cujas regras falham ABERTO) crescer PAGA pelo encolhimento das seções seguras — invisível.
      # A suíte de falsificação do gate roda no passo `Hooks guard tests` (test-claude-md-budget.sh).
      - name: CLAUDE.md size budget
        run: bun run claude:size

      # Guards de PreToolUse (colisão multi-sessão, comando destrutivo, imutabilidade de migration):
      # cada um tem suíte HERMÉTICA (sem rede) em scripts/test-*-guard.sh — os de colisão stubam
      # git/gh num mktemp; os demais não saem do processo (só passam strings ao hook) ou montam um
      # repo git temporário com `git init`.
      # Os DOIS laços do `test:hooks` são a ÚNICA coisa que roda essas suítes — script fora deles é
      # teste órfão, e teste que não roda é ausência de dado, não aprovação: o guard regride em
      # silêncio. Ao criar um scripts/test-<x>.sh (com ou sem sufixo -guard), ACRESCENTE <x> ao laço
      # correspondente no package.json. Quem cobra isso é scripts/hooks-guard-cobertura.test.ts, que
      # lê os dois laços e cobra TODO scripts/test-*.sh; a única saída é a baseline explícita de
      # scripts/hooks-suites-baseline.ts (hoje só a família `heavy`, que é macOS-only), com
      # burn-down obrigatório.
      - name: Hooks guard tests
        # sem `heavy` aqui: o semáforo de RAM é da M2 local e nao existe no runner (exit 127).
        run: bun run test:hooks

      # Falsificação das suítes acima — blocking. O step anterior prova que os hooks fazem o que a
      # suíte diz; ESTE prova que a suíte SABE FICAR VERMELHA. Cada alvo é sabotado com `sed`, uma
      # regra por vez, e a suíte tem de reprovar em cada sabotagem; se ficar verde, aquela asserção
      # era teatro. Sem ele, um PR pode afrouxar as asserções e o `test:hooks` continua verde.
      #
      # Nasceu como job separado no #1947, com a justificativa de que não caberia aqui — e o
      # primeiro run REFUTOU a própria justificativa: **0,9min** contra `validate` em 8,15min e
      # timeout de 15. A estimativa vinha da M2 do founder (swap, ~30 worktrees, fila do `heavy`),
      # onde o mesmo comando varia ~3x entre execuções e o `test:hooks` leva 24min — medição local
      # não projeta runner. Com o número real, a escolha se inverte: dentro do `validate` ele BARRA
      # (é o único check required, e o auto-merge só espera os required), enquanto em job próprio
      # o merge acontecia ANTES de ele terminar — vermelho depois do merge que ninguém lê, a mesma
      # classe do gate de dead-code medida no #1212.
      #
      # Custo: ~11% no wall-clock do job, ~6min de folga ainda no timeout. Se um dia apertar, o
      # corte certo é a fixture da suíte (foi de onde vinha o custo), não a cobertura.
      - name: Falsificação — sabota o alvo e EXIGE vermelho em cada regra
        run: bun run test:falsificacao

      # Evals da skill lovable-deploy-verify — blocking. A skill decide se um Publish está NO AR
      # (Passo 4, verify-frontend.sh) e quais das 3 camadas de deploy um diff exige (Passo 1,
      # classify.sh). Errar isso é dar "está no ar" para mudança que não subiu — e os evals que
      # protegem essa decisão rodavam em lugar NENHUM: medido em 2026-08-26,
      # `grep -rn 'verify-frontend-eval|lovable-deploy-verify' .github/ package.json` deu ZERO
      # ocorrências. 25 casos + 12 sabotagens do Passo 4 e 8 casos + 8 sabotagens do Passo 1
      # dormentes, valendo só quando alguém lembrasse de rodar à mão — mesma classe do `test:edges`
      # antes do #1498 (suíte pronta no repo, script pronto no package.json, CI nunca chamou).
      #
      # Roda o AGREGADOR (evals/run.sh), não o verify-frontend-eval direto: run.sh é a fonte única
      # que encadeia os DOIS evals e propaga o exit (`|| rc=1` em cada, `exit "$rc"`). Propagação
      # PROVADA, não lida: sabotando o regex do entry no verify-frontend.sh real, run.sh saiu 1 com
      # 19 casos vermelhos. Chamar só o do Passo 4 deixaria o Passo 1 dormente pelo mesmo motivo
      # que este step existe.
      #
      # Dependências no runner: python3 (http.server das fixtures + o eval do classify) e git
      # (fixture do guard --pai). Ambos vêm no ubuntu-latest, mas o que garante o step não é a
      # presença e sim o comportamento na AUSÊNCIA — com um python3 quebrado no PATH os DOIS modos
      # saem exit 2 ("servidor de fixtures não subiu") antes de qualquer caso: fail-CLOSED, nunca
      # verde por dependência faltando (`command -v` não bastaria: presente-porém-quebrada esvazia
      # o guard igual). A largada do servidor é poll de 100x0,05s com exit 2 no estouro, não sleep
      # fixo, então runner frio não vira flake. Zero rede externa: as fixtures são servidas em
      # 127.0.0.1 numa porta EFÊMERA e toda url dos casos é local — nenhum caso varre produção.
      - name: Evals da skill lovable-deploy-verify (Passo 1 + Passo 4)
        # sem `heavy` aqui: o semáforo de RAM é da M2 local e nao existe no runner (exit 127).
        run: bun run evals:deploy-verify

      # Falsificação dos evals acima — blocking, e o step anterior NÃO a cobre. Aquele prova que a
      # skill faz o que os evals dizem; ESTE sabota a skill (20 sabotagens: fechamento transitivo,
      # fonte precache, guard de exclusividade, sonda do 2º emissor, gabarito do classify) e exige
      # que cada eval fique VERMELHO. Sem ele um PR afrouxa as asserções e o step de cima segue
      # verde — teatro. As sabotagens são feitas em CÓPIAS dentro do mktemp do harness; o script
      # versionado nunca é mutado (conferido: árvore limpa depois do run), então não há resíduo.
      #
      # DENTRO do `validate`, não em job próprio — é a mesma escolha já medida no #1947 logo acima,
      # e vale igual aqui: `validate` é o único check required e o auto-merge só espera os required,
      # então em job separado o merge acontece ANTES deste terminar (vermelho depois do merge que
      # ninguém lê — classe do gate de dead-code do #1212). Tornar o job separado required também
      # não serve: exigiria mudar branch protection fora do repo e, com `paths:`, o check nunca
      # reporta quando o filtro não casa e o PR fica pendente pra sempre.
      #
      # O custo de blast-radius que um gate compartilhado costuma ter está INVERTIDO aqui: estes
      # evals não leem `src/`, `package.json`, `node_modules` (usam cwd neutro de propósito) nem a
      # rede, então PR de produto não consegue deixá-los vermelhos — só PR que toca a própria
      # skill, que é exatamente quando devem barrar. Custo REAL no runner, medido no primeiro run
      # depois do #2041 (run 32983531687): 2s + 2s, contra `validate` em 570s — 0,7% do job.
      # A medição LOCAL não previa isso e não devia mesmo (lição do #1947): nesta M2 o mesmo
      # comando variou de 6s a 70s conforme a carga (~30 worktrees), e o `bun run` não era o
      # culpado (bash direto deu 70s no instante em que o `bun run` deu 45s). O erro de projetar
      # daqui é de UMA ORDEM DE GRANDEZA, e para o lado caro — quem estimar custo de CI pela M2
      # vai recusar gate barato. Se um dia apertar o timeout de 15min do job, o corte certo é a
      # fixture, não a cobertura.
      - name: Falsificação — sabota a skill e EXIGE vermelho em cada eval
        run: bun run evals:deploy-verify:falsificacao

      # Anti-regressão de gate de autorização em RPCs SECURITY DEFINER sensíveis (custo/preço/
      # estoque). Mata o padrão "CREATE OR REPLACE derrubou o gate" — 3 ocorrências (5 views #1246,
      # get_tint_prices, fin_estimar_estoque_omie #1264). Estático: lê supabase/migrations/ no
      # estado final (last-writer-wins), sem Postgres. Parte A (regressão) + Parte B (cobertura).
      # Manifest: scripts/authz-manifest.ts. Spec: docs/superpowers/specs/2026-07-09-authz-gate-regression-check-design.md
      - name: Authz gate check (RPCs SECDEF sensíveis)
        run: bun run authz:check

      # Irmão do gate acima no MESMO domínio, e a divisão entre eles é o ponto: `authz:check` lê o
      # REPO (migrations) e nunca vê produção; os audits de prod leem o BANCO e são os únicos que
      # pegam `GRANT`/`REVOKE` colado à mão no SQL Editor e migration que mergeou e nunca foi
      # aplicada. Só que eles NÃO rodam aqui — o runner não tem `psql-ro`, e não deve ter: a
      # credencial é local (`~/.config/afiacao/psql-ro`, role `claude_ro`). Sem cadência, a garantia
      # deles era "alguém rodou um dia" — a classe de docs/historico/fase-sem-sinal.md, e a lacuna
      # que o próprio domínio já tinha nomeado ("roda on-demand. Entre duas execuções, a janela
      # existe", sentinela-authz-controle-nao-mencao.md §9.6).
      # A ponte é o CARIMBO: a medição fica onde está a credencial (o laptop), o sinal fica onde já
      # há cadência (aqui). Este step cobra só os eixos que um PR CONSEGUE consertar — contrato ou
      # auditor mudou sem re-medir, carimbo ausente/ilegível/no futuro. Idade e achado vivo em prod
      # NÃO entram aqui: o conserto deles é paste do founder no SQL Editor, e travar a fila de ~30
      # worktrees puniria justamente quem não pode consertar. Esses dois vivem no job
      # `authz-sentinela` (main), com Issue própria. Estático: lê o JSON, sem rede.
      - name: Authz carimbo de prod (evidência foi produzida para ESTE contrato?)
        run: bun run authz:carimbo

      # Anti-regressão do pin do bun (follow-up do PR #1352). Prova que TODO `bun-version` é semver
      # ESTRITO x.y.z e que as ocorrências convergem — as 3 armadilhas do comentário lá em cima.
      # Existe porque a regressão é INVISÍVEL: com `latest` (ou `1.3`/`1.3.x`/`bun-v1.3.15`) a action
      # cai na api.github.com, o CI fica VERDE, e o SPOF só aparece quando a API do GitHub degrada —
      # como em 2026-07-16, que matou todo PR do repo em ~6s. Comentário não barra ninguém e todo PR
      # não-draft auto-mergeia no verde. Estático: lê .github/workflows/, sem rede.
      - name: Bun pin gate check (semver estrito x.y.z)
        run: bun run bunpin:check

      # Anti-regressão do ÍNDICE dos diretórios de docs que têm README (hoje `docs/historico/` e
      # `docs/runbooks/`). Doc sem linha no índice — ou linha apontando para arquivo que sumiu — é
      # bug SILENCIOSO por construção: o arquivo existe, o CI passa, e ninguém o encontra. Medido:
      # o #1658 reconciliou o índice do histórico à mão (9 arquivos invisíveis, metade do histórico
      # recente) e HORAS depois o #1659 — uma PR de FEATURE que só por acaso escreveu um doc — já
      # reintroduziu um. A convenção textual ("registre aqui") existia o tempo todo. Gate de
      # PRECISÃO: só diretório COM README (ter README é a declaração de "aqui há índice");
      # `docs/agent/` fica fora porque quem o indexa é a tabela do CLAUDE.md, que enumera DOMÍNIOS —
      # review.md/threat-model-template.md/csv-governo-br.md são sub-docs alcançáveis a um salto e
      # seriam 3 falsos-positivos permanentes. Estático: lê docs/, sem rede.
      - name: Docs índice gate (nenhum doc invisível)
        run: bun run docs:indice

      # Irmão do gate acima, para a outra metade da mesma classe: lá o doc some do índice, aqui a
      # CITAÇÃO some do alvo. `arquivo:linha` não tem vínculo com o conteúdo — qualquer inserção
      # acima do ponto citado desloca o alvo e a citação passa a apontar para outra coisa EM
      # SILÊNCIO (arquivo existe, linha existe, CI verde). Medido na janela de um dia: o #1803
      # gravou 5 citações na §7 de `01-direcao.md`; o #1813 inseriu 2 linhas no cabeçalho de
      # `03-roadmap.md` e as 5 passaram a apontar para linhas de `**ICE**: I=8 · C=10 · E=9`.
      # Pegou por leitura manual, por acaso. Por isso a citação carrega âncora co-locada
      # (`<!--cita: trecho-->`) e o gate compara com o conteúdo REAL da linha — checar só "o
      # arquivo tem N linhas" não pegaria nada, porque a linha continuava existindo.
      # Escopo de PRECISÃO: só docs VIVOS. `historico/`, `superpowers/` e `ux-audit/` são
      # artefatos DATADOS — citar o código do dia deles é correto, e cobrá-los seria churn sobre
      # história (553 das 580 citações do repo estão lá). Estático: lê docs/, sem rede.
      - name: Docs citações gate (arquivo:linha ainda aponta pro que diz)
        run: bun run docs:citacoes

      # Terceiro irmão da família: os dois gates acima leem o ÍNDICE e a CITAÇÃO, e nenhum RESOLVE
      # link. Medido no #1863: `](../../docs/historico/…)` escrito de `.claude/skills/fecho/` cai em
      # `.claude/docs/historico/…` — os dois gates ficaram VERDES com o link quebrado. E
      # `.claude/skills/` (35 arquivos, o maior corpo de instrução operacional do projeto) não tinha
      # cobertura automatizada NENHUMA: nenhum código do repo lê as skills, então nada as media.
      # Ao nascer o gate achou 10 links quebrados vivos na main, todos da mesma variante — caminho
      # escrito a partir da RAIZ do repo dentro de doc que não está na raiz. Entra em ZERO, sem
      # baseline/allowlist (arquivo-lista de exceção é o começo do gate que ninguém lê).
      # A autoridade é o índice do GIT, não o `existsSync`: o APFS do macOS é case-insensitive, e
      # `](../Historico/x.md)` passaria no laptop para quebrar aqui e no GitHub. Estático, sem rede.
      - name: Docs links gate (link relativo de .md resolve)
        run: bun run docs:links

      # Frescura do manual: o CLAUDE.md e a maquinaria conferem um ao outro nos DOIS sentidos.
      # (1) nome citado que nao aponta para nada — `manifesto.gate` era citado como comando e nao
      # existe em package.json nem em workflow; (2) gate que reprova e o manual nao cita — foi o
      # `docs:indice` que reprovou o #2328, ausente do CLAUDE.md. As duas metades custam o mesmo:
      # o gate so reprova DEPOIS do fato quando podia ter orientado ANTES.
      # O sentido 2 nao varre prosa. Ele exige o censo delimitado de docs/agent/deploy.md, que
      # bate EXATO com o inventario daqui — porque a versao anterior era prosa datada ("15 steps",
      # 2026-08-23) e era a UNICA mencao de 5 gates num CI que ja tinha 28. Aceitar prosa que
      # envelhece faria o gate nascer incapaz de pegar o proprio caso de origem: sempre-verde e o
      # espelho de sempre-vermelha.
      # Este step e o eixo de DENTRO — ele le o ci.yml morando no ci.yml. Os de fora sao
      # `gates-frescura-check.test.ts` (vitest, fixtures sinteticas) e `test-gates-frescura.sh`
      # (bash, sabota copia real), este ultimo sob `test:hooks` e `test:falsificacao`.
      - name: Frescura do manual (CLAUDE.md <-> ci.yml/hooks, dois sentidos)
        run: bun run gates:frescura

      # Exclusividade: um gate NOVO precisa provar que pega algo que nenhum outro pega.
      #
      # Este step e BARATO por construcao — le um JSON e compara com o ci.yml; nao executa gate
      # nenhum. A medicao cara (n defeitos x m gates, sabotando o repo REAL, uma sabotagem por
      # vez) roda FORA do CI em `bun run exclusividade:medir` e grava
      # `scripts/exclusividade-matriz.json`. Mesmo desenho do `authz:carimbo`: medir onde ha o
      # que medir, bloquear onde precisa bloquear.
      #
      # POR QUE EXISTE: o custo de um gate e medido para sempre (segundos neste log, a cada PR) e
      # ate 2026-09-07 o beneficio nao era medido em lugar nenhum. Com um lado da conta visivel e
      # o outro nao, "criar mais um gate" era sempre a escolha barata — 15 comandos-gate entraram
      # em 3 semanas e ESTE job cresceu 4,4x em 11 dias.
      #
      # O QUE ELE NAO FAZ: reprovar por exclusividade zero. Corpus curto nao mede gate raro
      # (`docs:links` tem dez achados no proprio historico e nao apareceu numa janela de 80 runs),
      # e condenar por ausencia de sinal e a armadilha no 1 do repo. Zero e RELATADO, com o
      # denominador colado. Quem corta e o founder, com a evidencia na mao.
      - name: Exclusividade de gate (gate novo prova o que so ele pega)
        run: bun run exclusividade

      # Anti-regressão de DEAD CODE (export sem consumidor, dep sem import). Existe porque o gate
      # só-local não barra ninguém, e isso foi MEDIDO: o #1212 zerou os 254 achados e verificou
      # `exit 0` em 2026-07-07, mas ficou 4 semanas em CONFLICTING (estado em que o auto-merge
      # nunca dispara) e só mergeou 566 commits depois, em 06/08. No dia seguinte já eram 64
      # achados — e nenhum era regressão do próprio #1212: TODOS nasceram na janela, o último
      # (`dedupeKeyProposta`, #1332) 21 MINUTOS antes do #1212 mergear. A faxina chegou na main já
      # vencida porque nada na janela foi barrado. A lição que este step encerra: medição de gate
      # FORA do CI expira, e a validade dela é a distância entre medir e mergear — verde local é
      # fato sobre um worktree num instante, verde de CI é fato sobre a main.
      # Roda `bunx knip` — o MESMO comando do health stack local (`/health`), de propósito: gate de
      # CI que diverge do comando local recria a lacuna que ele veio fechar. Config: knip.json.
      # Quando quebrar: des-exportar (não deletar) é o default — não altera comportamento e só
      # reduz alcance. Export que é contrato de teste ou fronteira de paridade byte-exata vai para
      # `ignore` no knip.json COM o porquê no commit (precedentes: sayerlack-sku.ts,
      # embalagem-captura-helpers.ts). Registro: docs/historico/faxina-knip-2026-07-07.md
      - name: Dead code gate (knip — export/dep sem consumidor)
        run: bunx knip

      # A metade DETERMINÍSTICA do mutation-check, aqui porque é barata (~1s medido sobre 92
      # padrões) e este job já é required via `validate`. Ela reprova quando ESTE diff INTRODUZ
      # um `.mut` ambíguo — o modo de falha do #2380, que duplicou o bloco SQL, deixou 18
      # padrões casando duas linhas e mergeou 42s depois do `mutation-check` concluir FAILURE,
      # porque aquele job não é required. Comparar contra a base é o que devolve a falha a quem
      # tocou o fonte, em vez de travar PR alheio — que é o motivo do job cheio seguir fora do
      # caminho obrigatório (leia o comentário dele, mais abaixo).
      # NÃO substitui o `mutation-check`: aqui a suíte não roda, então isto não afirma NADA
      # sobre cobertura. Só afirma que os padrões ainda são cirúrgicos.
      - name: Contratos de mutação ainda cirúrgicos (mutcheck --seco, introduzidos por ESTE diff)
        run: bash scripts/mutcheck-seco-gate.sh origin/${{ github.base_ref || 'main' }}

  # ─── Agregador — É ESTE o required status check ─────────────────────────────
  # `validate` não roda trabalho nenhum: ele só AFIRMA que os 4 jobs acima terminaram em
  # success. Existe porque é o único context exigido pela branch protection da main e o que
  # o auto-merge.yml espera — o fan-out não podia custar o nome dele.
  #
  # ⚠️ `if: always()` não é enfeite, é o que torna o gate fail-CLOSED. Sem ele, um job em
  # `needs:` que falhe deixa este job **skipped** — e o GitHub trata required check skipped
  # como SATISFEITO. O resultado seria auto-merge de PR vermelho: exatamente a falha ABERTA
  # que o CI existe para impedir. Com `always()` o job SEMPRE roda e o veredito vem do step
  # abaixo, que exige `success` POSITIVO de cada um (ausência de dado reprova).
  #
  # É também aqui que `cancelled` deixa de ser invisível: job estourado por `timeout-minutes`
  # tem `result == 'cancelled'`, que NÃO é `success` e portanto reprova com nome próprio no log
  # — antes, o run inteiro saía `cancelled` e sumia de qualquer leitura que só procura `failure`.
  # ══════════════════════════════════════════════════════════════════════════════
  # provas-sql — SQL EXECUTADO no caminho obrigatório do merge.
  #
  # O buraco que este job fecha, medido em 2026-09-07: o repo tinha **289** arquivos
  # `db/test-*.sh` — provas que sobem um Postgres 17 de verdade, aplicam a migration
  # e asseveram o comportamento — e a única menção a eles no `ci.yml` era um
  # COMENTÁRIO. Zero `services:`, zero postgres. Nenhuma linha de SQL era executada
  # no caminho do merge.
  #
  # Isso deixava sem gate nenhum exatamente as classes que só um banco real pega, e
  # que são as caras: TOCTOU / guard fora da escrita (10 fixes no histórico, 100%
  # money-path), PL/pgSQL late-bound (o `CREATE` passa, a função só quebra em
  # RUNTIME) e `security_invoker` omitido num CREATE OR REPLACE VIEW — falha ABERTA
  # em que a view passa a ler como OWNER e bypassa RLS, e que nenhum gate textual vê.
  #
  # ## Por que binário do PGDG, e não `services: postgres:17`
  #
  # As 289 provas não conectam a um servidor externo: cada uma faz o seu próprio
  # `initdb` + `pg_ctl` numa porta própria, cria fixtures, aplica a migration REAL do
  # repo e destrói o cluster no `trap EXIT`. Um `services:` (container à parte) não
  # compartilha o socket unix do runner e obrigaria a reescrever a conexão de todas
  # — criando a divergência "roda no laptop / roda no CI" que o gate do shellcheck
  # logo acima veio fechar. Pior: um cluster COMPARTILHADO não isola `CREATE ROLE`
  # nem `ALTER ROLE`, que são de cluster e não de database — e boa parte das provas
  # de RLS depende justamente disso (parecer Codex gpt-6-astra, 2026-09-07).
  #
  # Com o binário instalado no runner, a prova roda no CI EXATAMENTE como no laptop.
  #
  # ## Custo
  #
  # Job próprio e PARALELO, entrando no `needs:` do `validate` — de propósito fora do
  # `gates-e-falsificacao`, que é o gargalo atual (mediana 357s). Carrega o RUNTIME bun
  # (só o runtime, sem `bun install`) e `fetch-depth: 0` desde que
  # `db/test-canaria-veredito.sh` entrou no núcleo: essa prova gera o SQL pelo próprio
  # gerador em vez de conferir um retrato commitado, e o gerador RECUSA emitir sem uma
  # `origin/main` contra a qual conferir que a árvore não está defasada. Não precisa de
  # deno, então o preâmbulo segue mais barato que o dos outros quatro.
  provas-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read

    steps:
      # fetch-depth: 0 porque `db/test-canaria-veredito.sh` gera o SQL pelo gerador real, e o
      # gerador tem guard fail-CLOSED: sem `origin/main` para comparar ele RECUSA emitir, em vez
      # de emitir a partir de uma árvore possivelmente defasada (o achado do #2143). Checkout
      # raso não traz a main, e o job reprovava com "origin/main não existe neste repo".
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # O núcleo inclui db/test-canaria-veredito.sh, que NÃO confere um SQL commitado:
      # gera o SQL pelo PRÓPRIO gerador (`db/lib/gerar-canaria-fixture.ts`) e, desde
      # 2026-09-10, também o SABOTA aqui — o 3º campo `falsificar=<n>` do manifesto faz o
      # runner rodar o `--falsificar` dela (antes as sabotagens só rodavam à mão). É isso
      # que faz a prova envelhecer junto com o gerador em vez de virar retrato velho. Só o
      # RUNTIME é preciso — os imports do gerador são builtins `node:*` mais um relativo,
      # então nada de `bun install` aqui. O `--falsificar` também usa `git worktree add`
      # (sabota o gerador num worktree do HEAD), que o checkout completo acima já cobre.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      # A versão é conferida POSITIVAMENTE, e o número exato vai para o log. Precedente
      # do próprio repo: o runner trazia shellcheck 0.9.0 contra 0.11.0 do laptop e o
      # gate reprovava PR sadio — "gate cuja VERDADE depende da versão do runner não é
      # gate, é sorteio". Aqui o piso é o que PRODUÇÃO roda (17.6 = 170006, medido via
      # psql-ro), conferido pelo runner perguntando `server_version_num` ao servidor.
      # Não se pina a minor exata de propósito: o PGDG remove pacotes antigos do índice,
      # e um pin assim viraria vermelho por AMBIENTE — o que ensinaria a tratar este job
      # como flaky, que é como um gate morre. O piso + o registro da versão dão o
      # determinismo que importa sem essa fragilidade.
      - name: PostgreSQL 17 (PGDG) — instala e confere a versão
        run: |
          set -euo pipefail
          if [ ! -x /usr/lib/postgresql/17/bin/initdb ]; then
            sudo install -d /usr/share/postgresql-common/pgdg
            sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
              https://www.postgresql.org/media/keys/ACCC4CF8.asc
            echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
              | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
            # O runner traz listas de terceiros (Chrome, Edge, MS) que este job NÃO usa, e o
            # `apt-get update` varre TODAS: um índice inconsistente em qualquer uma aborta o
            # step inteiro sob `set -e`. Medido 2026-09-09 (runs 34383259513 e dois reruns):
            # `Hash Sum mismatch` no repo do Chrome derrubou `provas-sql` três vezes seguidas,
            # sem nada a ver com PostgreSQL. Removemos só o que não é necessário — sem
            # `|| true`, que mascararia falha real do PGDG ou do repo base.
            # Glob AMPLO e por conteúdo: o runner declara essas fontes ora em `.list`, ora no
            # formato deb822 `.sources` — remover só `google-chrome.list` não pegou (medido no
            # run 34385454727, o erro persistiu). O `ls` fica para diagnóstico: sem ele, cada
            # tentativa custa um ciclo de CI inteiro só para descobrir onde a fonte mora.
            ls -la /etc/apt/sources.list.d/ || true
            sudo rm -f /etc/apt/sources.list.d/*google* /etc/apt/sources.list.d/*chrome* \
                       /etc/apt/sources.list.d/*microsoft* /etc/apt/sources.list.d/*msprod* || true
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-17
          fi
          instalada="$(/usr/lib/postgresql/17/bin/initdb --version)"
          echo "  $instalada"
          printf '%s' "$instalada" | grep -qE '\(PostgreSQL\) 17\.' || {
            echo "::error::initdb não é PostgreSQL 17: $instalada"; exit 1; }

      # O runner (db/roda-nucleo-ci.sh) começa por uma SONDA: sobe um cluster e pergunta
      # `server_version_num` ao servidor. Sem ela, "Postgres ausente" e "todas as provas
      # passaram" produziriam o mesmo verde — `ausente ≠ zero` aplicado ao CI.
      # Ele também exige, por prova, o mínimo de asserts declarado em `db/nucleo-ci.txt`:
      # o fechamento das provas é `[ "$FAIL" -eq 0 ]`, que TAMBÉM aceita PASS=0, e uma
      # prova truncada sairia 0. Falsificação: o step seguinte.
      - name: Núcleo de provas SQL executadas (db/nucleo-ci.txt)
        run: bash db/roda-nucleo-ci.sh

      # O dente do RUNNER, provado onde o runner vale. `db/falsifica-nucleo-ci.sh` restaura
      # defeitos que existiram e exige vermelho PELO MOTIVO CERTO: no runner (manifesto vazio,
      # prova esvaziada ou encolhida, PG ausente, e — desde 2026-09-10 — o recibo `SABOTAGENS:`
      # ausente, duplicado ou malformado, a flag ignorada, a falsificação encolhida ou OMITIDA)
      # e em 3 migrations reais. Até 2026-09-10 ele só rodava à mão, e o runner acima acabava
      # de ganhar um caminho novo: gate cujo dente só se prova à mão é ausência de dado
      # (docs/historico/falsificacao-fora-do-ci.md). Tem controle positivo pelo runner — sem
      # ele, um runner que reprovasse TUDO passaria em todos os casos de recusa — e piso de
      # casos (`OK_MINIMO`), porque `XX=0` sozinho aprovaria o harness truncado.
      # Serial DEPOIS do núcleo, de propósito: os dois sobem a sonda na porta TCP 5810.
      - name: Falsificação do núcleo — o runner reprova pelo motivo certo?
        run: bash db/falsifica-nucleo-ci.sh

  validate:
    if: always()
    needs: [typecheck, testes, edges-e-build, gates-e-falsificacao, provas-sql]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # issues:write p/ o alerta de main-vermelha (abaixo) abrir Issue.
    permissions:
      contents: read
      issues: write

    steps:
      - name: Todos os jobs passaram? (exige 'success' POSITIVO de cada um)
        env:
          RESULTADOS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          esperados=5
          total=0; falhou=0; viu_provas_sql=0
          while IFS="$(printf '\t')" read -r job resultado; do
            total=$((total + 1))
            [ "$job" = "provas-sql" ] && viu_provas_sql=1
            if [ "$resultado" = "success" ]; then
              echo "  ✅ $job: success"
            else
              echo "  ❌ $job: ${resultado:-<vazio>}"
              falhou=$((falhou + 1))
            fi
          done < <(printf '%s' "$RESULTADOS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"')

          # Guard do DENOMINADOR — sem ele, um `needs` mal escrito ou um jq que devolvesse nada
          # deixaria total=0/falhou=0 e este gate aprovaria por AUSÊNCIA de dado, não por prova.
          # Job novo no fan-out: some 1 aqui E no `needs:` acima (os dois, ou o CI avisa).
          if [ "$total" -ne "$esperados" ]; then
            echo "::error::li $total job(s), esperava $esperados — o agregador não pode afirmar nada."
            exit 1
          fi
          # Guard NOMINAL (parecer Codex, 2026-09-07): "cinco jobs quaisquer não provam que SQL
          # entrou no contrato". O denominador acima só conta; este exige a IDENTIDADE do job que
          # executa as provas de banco. Sem ele, renomear `provas-sql` — ou trocá-lo por qualquer
          # outro job — manteria total=5 e o agregador seguiria dizendo ✅ com o SQL fora do merge.
          if [ "$viu_provas_sql" -ne 1 ]; then
            echo "::error::o job 'provas-sql' não está entre os $total lidos — as provas SQL saíram do caminho obrigatório."
            exit 1
          fi
          if [ "$falhou" -ne 0 ]; then
            echo "::error::$falhou de $total job(s) não terminaram em success (cancelled = estouro de timeout-minutes)."
            exit 1
          fi
          echo "✅ os $total jobs do fan-out terminaram em success"

      # ─── Alerta de regressão (Componente 1 — mitigação de reversão Lovable) ──
      # O bot do Lovable commita DIRETO na main sem PR/CI; quando quebra build/
      # typecheck (ex.: types.ts stale #1079), o CI fica vermelho mas passa
      # SILENCIOSO (ninguém olha). Este step abre/atualiza uma Issue p/ o sinal
      # chegar ao founder. Só na main — em PR o autor já vê o vermelho. Spec:
      # docs/superpowers/specs/2026-06-26-lovable-revert-mitigation-design.md
      - name: Alerta de main vermelha → GitHub Issue
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const sha = context.sha.slice(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const head = context.payload.head_commit || {};
            const msg = (head.message || '').split('\n')[0];
            const author = (head.author && head.author.name) || context.actor;
            const label = 'ci-main-red';
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'd73a4a', description: 'CI da main quebrado por push direto (sem PR)' });
            } catch (e) { /* label já existe */ }
            const body = [
              '🔴 **CI da `main` falhou.**',
              '',
              `- Commit: \`${sha}\` — ${msg}`,
              `- Autor: ${author}`,
              `- Run: ${runUrl}`,
              '',
              'Provável reversão por commit direto do Lovable (sem PR/CI). Restauração rápida: `docs/agent/deploy.md`.',
            ].join('\n');
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🔴 CI vermelho na main', body, labels: [label] });
            }

      # Fase 2 do Componente 1: quando a main VOLTA a verde, fecha a(s) Issue(s)
      # ci-main-red abertas (senão a Issue fica órfã e o sinal perde valor). Idempotente:
      # sem Issue aberta = no-op. success() é false se qualquer step do job falhou.
      - name: main voltou a verde → fecha Issue ci-main-red
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const sha = context.sha.slice(0, 8);
            const label = 'ci-main-red';
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ CI da \`main\` voltou a verde em \`${sha}\`. Fechando automaticamente.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

  # ─── Sentinela da evidência de authz em produção (main, não-bloqueante) ──
  # Os dois eixos que o step do `validate` deliberadamente NÃO cobra: idade do carimbo e achado
  # vivo em prod. Roda só na main (schedule diário/push/dispatch), então nunca segura PR de
  # ninguém.
  #
  # ⚠️ O JOB FICA VERDE QUANDO CONSEGUIU AVALIAR — inclusive com produção divergente. "O monitor
  # funcionou" e "produção está limpa" são fatos DIFERENTES, e um job que os mistura vira um sinal
  # que não se sabe ler. Quem carrega o vermelho de produção é a Issue `authz-prod`. O job só
  # falha quando o gate não conseguiu avaliar (exit 2) — aí a evidência é que o observador quebrou.
  #
  # ⚠️ Canal PRÓPRIO, e não a Issue `ci-main-red` do job acima: o corpo daquela afirma "Provável
  # reversão por commit direto do Lovable" — diagnóstico ERRADO para este sinal, que mandaria o
  # founder para `deploy.md` procurar um incidente que não existe. Sensor que significa duas coisas
  # é o precedente dos 4 vazios no mesmo pixel (docs/historico/fase-sem-sinal.md §2).
  authz-sentinela:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install deps
        run: bun install --frozen-lockfile

      # `continue-on-error` é DE PROPÓSITO: exit 1 do gate significa "produção/idade tem algo a
      # dizer", e isso é conteúdo para a Issue, não falha do monitor. exit 2 (o gate não conseguiu
      # avaliar) é tratado como falha real no step seguinte.
      - name: Avalia o carimbo (idade + achado vivo)
        id: gate
        continue-on-error: true
        run: |
          set +e
          bun run authz:carimbo -- --exigir-frescor --json > /tmp/carimbo.json 2> /tmp/carimbo.err
          echo "rc=$?" >> "$GITHUB_OUTPUT"
          cat /tmp/carimbo.err || true

      - name: Gate não conseguiu avaliar (exit 2) é falha do MONITOR
        if: steps.gate.outputs.rc == '2'
        run: |
          echo "::error::authz:carimbo saiu 2 — o gate não conseguiu avaliar o carimbo."
          cat /tmp/carimbo.err || true
          exit 1

      - name: Sincroniza a Issue authz-prod
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const label = 'authz-prod';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let dados;
            try { dados = JSON.parse(fs.readFileSync('/tmp/carimbo.json', 'utf8')); }
            catch (e) { core.setFailed(`veredito ilegível: ${e.message}`); return; }
            const vereditos = (dados.vereditos || []).filter(v => v.codigo !== 'CARIMBO_AVISO');
            const avisos = (dados.vereditos || []).filter(v => v.codigo === 'CARIMBO_AVISO');
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205',
                description: 'Evidência de authz de produção: carimbo vencido ou achado vivo' });
            } catch (e) { /* label já existe */ }
            const abertas = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });

            if (vereditos.length === 0) {
              // Fecha SÓ contra uma medição nova e limpa — nunca "porque o workflow passou".
              for (const issue of abertas.data) {
                await github.rest.issues.createComment({ owner, repo, issue_number: issue.number,
                  body: `✅ Nova medição limpa e fresca. ${avisos.map(a => a.mensagem).join(' ')} Run: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              core.info('carimbo fresco e sem achado — nada a sinalizar.');
              return;
            }
            const corpo = [
              '🔴 **Evidência de autorização de produção precisa de ação.**',
              '',
              ...vereditos.map(v => `- \`[${v.codigo}]\` ${v.mensagem}`),
              '',
              '**Como limpar:**',
              '- `CARIMBO_VELHO` → rode `bun run authz:carimbo:gravar` na máquina com `psql-ro` e commite `db/authz-carimbo-prod.json`.',
              '- `CARIMBO_ACHADO` → o fix é DDL: prepare o bloco e cole no SQL Editor do Lovable, depois re-rode o runner.',
              '',
              `Run: ${runUrl}`,
              '',
              `⚠️ O carimbo atesta ${(dados.audits || []).length} FATIAS curadas da autorização (${(dados.audits || []).join(', ')}), não a autorização inteira — pontos cegos declarados em \`docs/agent/database.md\` §1.`,
            ].join('\n');
            if (abertas.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: abertas.data[0].number, body: corpo });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🔴 Evidência de authz de produção', body: corpo, labels: [label] });
            }

  # ─── Job NÃO-bloqueante (informativo, sinal próprio) ────────────────
  # Gate de regressão de COBERTURA money-path (≠ os checks do `validate`, que
  # cobrem tipos/comportamento/build/lint). Roda os contratos scripts/mutcheck.d/*.mut
  # via scripts/mutcheck.sh — mutation-check: um teste só vale se FALHA quando a
  # invariante é violada (plantamos o bug, medimos se a suíte o mata).
  # ⚠️ NÃO é required na branch protection POR ORA: os .mut casam TEXTO EXATO do
  # helper, então um refactor legítimo pode dessincronizá-los (INVÁLIDO) e travaria
  # PRs alheias num repo multi-sessão. Promova a required (igual ao lint) quando os
  # .mut amadurecerem. `--selftest` valida a própria ferramenta. Ver CLAUDE.md §13.
  mutation-check:
    runs-on: ubuntu-latest
    # Mesmo motivo do teto do `validate` (leia o comentário lá): timeout aqui seria ausência de
    # dado vestida de reprovação. Medido em 2026-09-07 sobre 28 runs: 346s a 533s — o pior já
    # consumia 89% do teto de 10min, um runner lento de distância do mesmo falso-vermelho. 15min
    # devolve a folga sem esconder regressão.
    # 2026-09-10: 6 PRs seguidos entre 531s e 873s (#2462 a 27s do corte) — o job cresceu ~60% em
    # 3 dias, um contrato por PR. No #2464 ele foi CANCELADO no último contrato (`valor-helpers`),
    # com os 44s do contrato novo; sem folga, todo PR seguinte perderia o sinal. Quem pesa é
    # `sonda-versao-sql.mut` (103 mutações, 7m26s ≈ metade do job). 25min volta a ~60% de uso; o
    # conserto de fundo é o fan-out por contrato, como o `validate` fez no #2346.
    timeout-minutes: 25
    # issues:write p/ o sensor abaixo abrir/fechar a Issue `mutcheck-cobertura`; contents:read p/ checkout.
    permissions:
      contents: read
      issues: write
    # FORA do `schedule` de propósito. O run diário existe para provar que a main passa nos gates
    # BLOQUEANTES; este job é informativo, não-required, e pode ficar INVÁLIDO por refactor legítimo
    # (ver o comentário acima). Rodando diário ele falharia sem abrir Issue nenhuma — os dois steps
    # de alerta vivem no job `validate` —, virando exatamente o sinal vermelho que ninguém lê. Além
    # de somar ~2m41s por dia sem leitor. Nos eventos de PR/push segue rodando igual.
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5

      # Semver estrito, mesmo motivo do job `validate` acima (manter as duas em sincronia).
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install deps
        run: bun install --frozen-lockfile

      # O job precisa do runtime de TODO contrato registrado, não só do default. Desde
      # `scripts/mutcheck.d/cmc-snapshot-retry.mut` há contrato de EDGE, cujo `# @test_cmd:`/
      # `# @compile_cmd:` é `deno` — sem este step o `deno` não existe no PATH, o compila-check do
      # SRC ORIGINAL falha e o mutcheck aborta com "harness/ambiente quebrado", derrubando o job
      # inteiro por ambiente, não por cobertura. Pin alinhado ao job `validate` (2ª ocorrência —
      # bump conferindo `deno --version` e alinhando as duas).
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.2

      - name: mutcheck — selftest (mecânica da ferramenta, sem vitest)
        run: bun run mutcheck:selftest

      - name: mutcheck — contratos de cobertura money-path (.mut)
        env:
          MUTCHECK_RESUMO: /tmp/mutcheck-resumo.json
        run: bun run mutcheck

      # O `mutcheck` acima roda a suíte INTEIRA e reporta o AGREGADO. Desde que a mecânica do
      # `controle_credencial` virou uma função só (sonda + canária), "PEGA" passou a significar
      # apenas "algum teste morreu" — uma metade bem coberta esconde a outra descoberta, e o `.mut`
      # ficaria afirmando cobertura que ninguém mediu. Este step roda a MESMA mutação contra cada
      # modo ISOLADO e exige vermelho nos dois. Vive aqui, e não à mão, porque falsificação que só
      # roda à mão é ausência de dado (docs/historico/falsificacao-fora-do-ci.md).
      #
      # 🔁 VOLTOU em 2026-09-09 (saiu pelo #2433 no mesmo dia, com a causa em aberto). A causa era
      # o GUARD, não o vitest: ele decidia "o filtro casou teste?" com `grep -qE 'Tests +[0-9]*
      # passed'` sobre a saída HUMANA, e no runner o vitest COLORE — entre `Tests` e o número há
      # escapes ANSI que o `+` (só espaços) nunca casa. O vitest ficava verde e o guard reprovava:
      # verde na M2, vermelho em TODO run do runner. Não era intermitente — o "verde do mesmo SHA"
      # que confundiu o diagnóstico era o run `schedule`, em que este job inteiro é SKIPPED pelo
      # `if` acima; job pulado não é job verde. O guard agora lê o reporter JSON (`numPassedTests`),
      # e o `--selftest` abaixo trava a regressão em ~0,1s, sem vitest.
      # Custo MEDIDO 2026-09-08 na M2 do founder, sem `heavy`: 20s (4 rodadas de vitest filtradas
      # por `-t`). O job tem teto de 15min e o step acima consome ~10min — cabe com folga.
      - name: prova por consumidor — o mutante compartilhado morre nos DOIS modos
        run: |
          bash scripts/prova-consumidores-controle.sh --selftest
          bash scripts/prova-consumidores-controle.sh

      # ─── Sensor (2026-09-07) ────────────────────────────────────────────────
      # Este job JÁ rodava na main a cada push — ele só não FALAVA. O vermelho do #2279 durou
      # ~10h e chegou ao founder por alguém abrir um run, não por um alarme; job vermelho sem
      # leitor treina a ignorar o sinal. Aqui ele ganha voz, SEM mudar quando roda (segue fora
      # do `schedule`, pelo motivo no comentário do job) e SEM mudar o veredito: o objeto medido
      # é o próprio commit, então job vermelho é semanticamente certo — o modelo é o `validate`,
      # não o `authz-sentinela` (que fica verde porque mede um sistema EXTERNO).
      #
      # ⚠️ Canal PRÓPRIO, e não a Issue `ci-main-red`: o corpo daquela afirma "Provável reversão
      # por commit direto do Lovable", diagnóstico ERRADO aqui — mandaria o founder para
      # `deploy.md` procurar incidente que não existe (mesma razão do `authz-prod`).
      #
      # O corpo SEPARA as duas causas porque os remédios são OPOSTOS, e o log as fundia:
      # INVÁLIDA = o `.mut` envelheceu com o fonte (corrigir o padrão; ruído esperado num repo
      # multi-sessão) × DIVERGE = a suíte perdeu poder (regressão de cobertura, o sinal caro).
      - name: Alerta de cobertura na main → GitHub Issue
        if: failure() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner, repo = context.repo.repo;
            const sha = context.sha.slice(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const label = 'mutcheck-cobertura';
            // Ausência de resumo é ausência de DADO, não "nada a relatar": o step pode ter morrido
            // antes de escrevê-lo (bun ausente, timeout). O corpo diz isso em vez de afirmar zero.
            let r = null;
            try { r = JSON.parse(fs.readFileSync('/tmp/mutcheck-resumo.json', 'utf8')); } catch (e) { /* sem resumo */ }
            const linhas = ['🧪 **O `mutation-check` falhou na `main`.**', '', `- Commit: \`${sha}\``, `- Run: ${runUrl}`, ''];
            if (!r) {
              linhas.push('⚠️ **Sem resumo estruturado** — o step não chegou a escrevê-lo (harness/ambiente, não cobertura). Leia o run.');
            } else {
              const ruins = r.contratos.filter(c => c.exit !== 0);
              const inval = ruins.reduce((a, c) => a + c.invalidas, 0);
              const diver = ruins.reduce((a, c) => a + c.divergencias, 0);
              const abortou = ruins.filter(c => c.abortou);
              linhas.push(`**${ruins.length}/${r.total} contrato(s) com problema** — ${diver} divergência(s), ${inval} inválida(s).`, '');
              if (diver > 0) linhas.push('🔴 **DIVERGE = a suíte PERDEU PODER.** Regressão de cobertura: uma mutação que era pega passou a sobreviver. Remédio: devolver o dente ao teste — **não** afrouxar o `.mut`.');
              if (inval > 0) linhas.push('🟡 **INVÁLIDA = o `.mut` envelheceu junto com o fonte** (padrão não casa mais, ou casa >1 linha). Remédio: corrigir o PADRÃO de mutação. É manutenção do contrato, não regressão.');
              if (abortou.length > 0) linhas.push('⚫ **Baseline vermelho/harness quebrado** — o monitor não conseguiu medir. Nada se conclui sobre cobertura aqui.');
              linhas.push('', '| contrato | exit | diverge | inválidas | sumário |', '| --- | --- | --- | --- | --- |');
              for (const c of ruins) linhas.push(`| \`${c.mut}\` | ${c.exit} | ${c.divergencias} | ${c.invalidas} | ${c.sumario || '—'} |`);
            }
            linhas.push('', 'Contexto da ferramenta: `scripts/mutcheck.sh` · contratos em `scripts/mutcheck.d/*.mut`.');
            const body = linhas.join('\n');
            try {
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'fbca04', description: 'mutcheck: contrato de cobertura com problema na main' });
            } catch (e) { /* label já existe */ }
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 1 });
            if (open.data.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.data[0].number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title: '🧪 mutcheck: cobertura com problema na main', body, labels: [label] });
            }

      # Gêmeo do fecho da `ci-main-red`: sem isso a Issue fica órfã e o sinal perde valor —
      # a próxima pessoa aprende que a Issue aberta não quer dizer nada. Idempotente (no-op sem
      # Issue aberta). `success()` é false se qualquer step do job falhou.
      - name: cobertura voltou ao contrato → fecha Issue mutcheck-cobertura
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner, repo = context.repo.repo;
            const sha = context.sha.slice(0, 8);
            const label = 'mutcheck-cobertura';
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 100 });
            for (const issue of open.data) {
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: `✅ Todos os contratos honrados em \`${sha}\`. Fechando automaticamente.` });
              await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
            }

